<!DOCTYPE html>
<html lang="es">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login - Monitor CR</title>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-96 border border-slate-700">
        <h2 class="text-2xl font-bold text-white mb-6 text-center">Acceso al Monitor</h2>
        
        <!-- Bloque para mostrar errores si el login falla -->
        {% if error %}
            <div class="bg-red-500/20 border border-red-500 text-red-400 p-3 rounded mb-4 text-sm text-center">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="block text-gray-400 text-sm mb-2">Usuario Web</label>
                <!-- Cambiado name="email" a name="username" -->
                <input type="text" name="username" required 
                    class="w-full p-3 rounded bg-slate-700 text-white border border-slate-600 focus:border-blue-500 outline-none">
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-400 text-sm mb-2">Contraseña Web</label>
                <input type="password" name="password" required
                    class="w-full p-3 rounded bg-slate-700 text-white border border-slate-600 focus:border-blue-500 outline-none">
            </div>
            
            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded transition duration-200">
                Iniciar Sesión
            </button>
        </form>
    </div>
</body>
</html>
