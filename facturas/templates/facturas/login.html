<!DOCTYPE html>
<html lang="es">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login - Monitor CR</title>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-96 border border-slate-700">
        <h2 class="text-2xl font-bold text-white mb-6 text-center">Acceso al Monitor</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-gray-400 text-sm mb-2">Correo de Gmail</label>
                <input type="email" name="email" required 
                    class="w-full p-3 rounded bg-slate-700 text-white border border-slate-600 focus:border-blue-500 outline-none">
            </div>
            <div class="mb-6">
                <label class="block text-gray-400 text-sm mb-2">Clave de 16 letras</label>
                <input type="password" name="password" required
                    class="w-full p-3 rounded bg-slate-700 text-white border border-slate-600 focus:border-blue-500 outline-none"
                    >
            </div>
            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded transition duration-200">
                Iniciar Monitoreo
            </button>
        </form>
        <p class="text-xs text-gray-500 mt-4 text-center">Tus credenciales se guardan solo en esta sesión.</p>
    </div>
</body>
</html>
